# Builds and tests the SDK on every push to main and every pull request. Nothing here
# tags, releases or publishes: that stays a manual step until the SDK is released.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # A hang fails here in 10 minutes, with a stack sample of every test process, rather
      # than silently running out the job's time.
      - name: Test (macOS), built with strict concurrency
        timeout-minutes: 15
        run: |
          ./scripts/test.sh -Xswiftc -strict-concurrency=complete &
          pid=$!
          for _ in $(seq 600); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$pid" 2>/dev/null; then
            echo "::error::Tests still running after 10 minutes: sampling the test processes"
            for p in $(pgrep -f 'xctest|swiftpm-testing-helper|KiroraPackageTests'); do
              sudo sample "$p" 5 || true
            done
            pkill -P "$pid" || true
            kill "$pid" || true
            exit 1
          fi
          wait "$pid"

      - name: Build for iOS (UIKit code included)
        run: |
          xcodebuild build \
            -scheme Kirora-Package \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete

      - name: Lint podspecs
        run: |
          pod lib lint KiroraNotificationService.podspec --allow-warnings
          pod lib lint Kirora.podspec --allow-warnings
