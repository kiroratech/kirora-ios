# Builds and tests the SDK on every push to main and every pull request. Nothing here
# tags, releases or publishes: that stays a manual step until the SDK is released.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test (macOS), built with strict concurrency
        run: ./scripts/test.sh -Xswiftc -strict-concurrency=complete

      - name: Build for iOS (UIKit code included)
        run: |
          xcodebuild build \
            -scheme Kirora-Package \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete

      - name: Lint podspecs
        run: |
          pod lib lint KiroraNotificationService.podspec --allow-warnings
          pod lib lint Kirora.podspec --allow-warnings
